<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Stock photo placeholder">
  <rect width="100%" height="100%" fill="#eef6ff"/>
  <g>
    <rect x="60" y="60" width="1080" height="555" rx="18" fill="#d8eefe" stroke="#cfe7ff"/>
    <text x="630" y="330" font-family="Tahoma, Arial, sans-serif" font-size="36" text-anchor="middle" fill="#0b63d6">Stock photo placeholder</text>
    <text x="630" y="370" font-family="Tahoma, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#6b7280">Replace this with a real clinic photo (recommended: 1600x900, JPG/WEBP)</text>
    <text x="630" y="410" font-family="Tahoma, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6b7280">Filename suggestion: assets/hero.jpg or assets/hero.webp</text>
  </g>
  <g transform="translate(40,520)" fill="#94c5ff">
    <rect x="0" y="0" width="220" height="36" rx="6"/>
    <text x="110" y="24" font-family="Tahoma, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#003a66">Use stock from Unsplash / Pexels</text>
  </g>
</svg>
